<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5"
    />
    <meta name="theme-color" content="#3a6ea5" />
    <meta
      name="description"
      content="A working Windows 2000 Professional desktop in your browser. Explore files, write, draw, play, and customize your computer."
    />
    <title>Windows 2000 Professional</title>
    <link rel="icon" href="/assets/icons/computer.png" />
    <link rel="stylesheet" href="/desktop.css" />
  </head>
  <body>
    <main id="desktop" aria-label="Windows 2000 desktop">
      <canvas id="desktop-surface" aria-hidden="true"></canvas>
      <div id="desktop-icons" aria-label="Desktop icons"></div>
      <div id="windows" aria-label="Open applications"></div>
      <div id="selection-rect" hidden></div>
    </main>
    <footer id="taskbar" aria-label="Taskbar"></footer>
    <div id="menu-layer"></div>
    <div id="overlay-layer"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
